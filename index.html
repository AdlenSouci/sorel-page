<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ea580c" />
    <title>Sorel Plastiques — Injection plastique et emballage alimentaire</title>
    <meta
      name="description"
      content="Injecteur de pièces techniques et spécialiste de l'emballage alimentaire depuis 1975. Plus de 200 modèles standards, coloration sur mesure, éco-conception."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sorel Plastiques" />
    <meta
      property="og:title"
      content="Sorel Plastiques — Injection plastique et emballage alimentaire"
    />
    <meta
      property="og:description"
      content="Injecteur de pièces techniques et spécialiste de l'emballage alimentaire depuis 1975."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Montserrat:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Montserrat:wght@400;500;600;700;800&display=swap"
      />
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sorel Plastiques",
        "description": "Injecteur de pièces techniques et spécialiste de l'emballage alimentaire depuis 1975.",
        "foundingDate": "1975",
        "areaServed": "Europe",
        "knowsAbout": [
          "Injection plastique",
          "Emballage alimentaire",
          "Thermoplastiques",
          "Éco-conception"
        ]
      }
    </script>
  </head>
  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="0"
      height="0"
      aria-hidden="true"
      style="position: absolute; overflow: hidden"
    >
      <defs>
        <filter
          id="sorel-liquid-glass"
          x="-20%"
          y="-20%"
          width="140%"
          height="140%"
          color-interpolation-filters="sRGB"
        >
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.01 0.078"
            numOctaves="2"
            seed="48"
            stitchTiles="stitch"
            result="raw"
          />
          <feGaussianBlur in="raw" stdDeviation="0.85" result="noise" />
          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="9"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
